<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приглашение на свидание</title>
    <style>
        body {
            background-color: #ffe6eb;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }
        h1 { color: #ff4b72; font-size: 24px; }
        p { color: #555; font-size: 16px; line-height: 1.5; }
        .btn {
            background-color: #ff4b72;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 15px;
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Секретное приглашение ✨</h1>
        <p>Привет! У меня есть для тебя одно важное предложение. Хочу пригласить тебя на особенный вечер.</p>
        <p><b>Детали:</b> Скоро узнаешь 😉</p>
        <button class="btn" onclick="alert('Ура! Я свяжусь с тобой ❤️')">Я согласна!</button>
    </div>
</body>
</html>
