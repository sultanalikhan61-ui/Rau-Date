<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Особенное приглашение ✨</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 20px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(255, 75, 114, 0.2);
            text-align: center;
            max-width: 400px;
            width: 100%;
            position: relative;
            backdrop-filter: blur(5px);
        }
        .gif-container img {
            width: 150px;
            height: 150px;
            border-radius: 20px;
            object-fit: cover;
            margin-bottom: 15px;
        }
        h1 {
            color: #ff3366;
            font-size: 22px;
            margin-bottom: 10px;
        }
        p {
            color: #555;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            position: relative;
            min-height: 60px;
        }
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
        }
        #yesBtn {
            background-color: #ff3366;
            color: white;
            box-shadow: 0 5px 15px rgba(255, 51, 102, 0.4);
            z-index: 2;
        }
        #noBtn {
            background-color: #e0e0e0;
            color: #666;
            position: absolute;
            z-index: 1;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 20px;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 24px;
            text-align: center;
            max-width: 350px;
            animation: popUp 0.4s ease;
        }
        @keyframes popUp {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <div class="gif-container">
            <img id="mainGif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM2Q1ZjIxM2I2ZDU0YjYyZDY1ZjRkM2Q4ZDM2ZDY1ZjRkM2Q4ZDY1ZiZlcD12MV9pbnRlcm5hbF9naWZzX2dpZklkJmN0PWc/cLS1cfxvGOPVpf9g3y/giphy.gif" alt="Cute gif">
        </div>
        <h1>У меня есть идея... ✨</h1>
        <p>Сходим на особенное свидание на этих выходных?</p>

        <div class="btn-group">
            <button id="yesBtn" onclick="acceptInvitation()">Да, с радостью! ❤️</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">Нет 🙈</button>
        </div>
    </div>

    <!-- Всплывающее окно после нажатия "Да" -->
    <div class="modal" id="successModal">
        <div class="modal-content">
            <h2>Урааа! 🎉</h2>
            <br>
            <img src="https://media.giphy.com/media/26hpKMT7M4iOTaQpO/giphy.gif" style="width:100%; border-radius:15px;">
            <br><br>
            <p>Я знал, что ты согласишься! До скорой встречи ❤️</p>
        </div>
    </div>

    <script>
        let yesScale = 1;

        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const yesBtn = document.getElementById('yesBtn');
            
            // Кнопка "Нет" убегает в случайное место
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 40) - (window.innerWidth / 2 - 100);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 40) - (window.innerHeight / 2 - 100);
            
            noBtn.style.transform = `translate(${x}px, ${y}px)`;

            // Кнопка "Да" становится всё больше!
            yesScale += 0.2;
            yesBtn.style.transform = `scale(${yesScale})`;
        }

        function acceptInvitation() {
            document.getElementById('successModal').style.display = 'flex';
            
            // Запуск салюта из конфетти
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
        }
    </script>
</body>
</html>
